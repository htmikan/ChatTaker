# Build plugin assets from source on tag push and attach them to the GitHub Release.
# Reviewers compare these CI artifacts to a clean rebuild from the tagged commit.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi

      # Digest-bound provenance for the files attached to the release.
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Build
            - Assets built on GitHub Actions from this tag (`npm ci` + `npm run build`)
            - `main.js` and `styles.css` have GitHub artifact attestations from this workflow
            - Node version: see `.nvmrc`
