# 言語を足す: 下の languages に id を追加し、各キーの下にも同じ id を書く。
# 無い文言は英語に戻る。編集後はプラグインを再読み込みする。
languages:
  en: English
  ja: 日本語

settings.language.name:
  en: Language
  ja: 言語
settings.language.desc:
  en: Plugin UI and saved-note labels. ChatGPT/Gemini page detection is unchanged.
  ja: プラグイン画面と保存ノートの見出しです。ChatGPT / Gemini のページ検出は変わりません。
settings.folder.name:
  en: Save folder
  ja: 保存フォルダ
settings.folder.desc:
  en: Vault-relative path. Missing folders are created on save.
  ja: Vault 内の相対パスです。無いフォルダは保存時に作ります。
settings.filename.name:
  en: Filename
  ja: ファイル名
settings.filename.desc:
  en: ".md / .pdf is added from the save format. Dates use {{date:YYMMDD_HHmmss}}. Tokens: YY, YYYY, MM, DD, HH, mm, ss."
  ja: 拡張子 .md / .pdf は保存形式に応じて自動で付きます。日付は {{date:YYMMDD_HHmmss}} の形式です。使える記号は YY、YYYY、MM、DD、HH、mm、ss です。
settings.debug.name:
  en: Enable citation debug
  ja: 引用デバッグを有効にする
settings.debug.desc:
  en: Also save a diagnostic JSON (*.debug.json) next to ChatGPT/Gemini notes. Turn this off for daily use.
  ja: ChatGPT / Gemini の保存時に、同じフォルダへ診断用 JSON（*.debug.json）を追加保存します。修正依頼用です。普段はオフにしてください。

